<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Shop — Search</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f6fa; padding: 24px; }
  .bar { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  button { background: #2f6fed; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  #res { max-width: 560px; margin: 16px auto; }
  .item { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
</style></head>
<body>
  <div class="bar">
    <input id="q" placeholder="Search products…">
    <button onclick="go()">Search</button>
  </div>
  <div id="res"></div>
  <script>
    function go() {
      const term = document.getElementById('q').value || 'everything';
      const items = ['Aurex Pro Headphones — ₹4,299', 'BoltCharge 65W GaN — ₹1,899', 'NimbleBuds Mini — ₹2,199'];
      document.getElementById('res').innerHTML = items.map(t => `<div class="item">${t.replace(/headphones|everything/i, m => `<b>${term === 'everything' ? m : term}</b>`)}</div>`).join('');
    }
  </script>
</body>
</html>
