<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FakePay Store — Checkout</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6fa; margin: 0; padding: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 560px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 18px; } h2 { font-size: 14px; margin: 18px 0 8px; }
    label { display: block; font-size: 12px; color: #555; margin: 8px 0 3px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    .row { display: flex; gap: 10px; } .row > div { flex: 1; }
    button { margin-top: 16px; width: 100%; background: #2f6fed; color: #fff; border: 0; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .price { font-size: 22px; font-weight: 700; }
    .ok { display: none; margin-top: 12px; padding: 10px; background: #e7f9ef; border: 1px solid #b6e6cc; color: #0b7a3c; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛒 Checkout — FakePay Store</h1>
    <p>Order total: <span class="price">₹4,299</span></p>
    <div>
      <b>Items:</b> 1× Aurex Pro Headphones<br><b>Ship to:</b> <span id="addrOut">—</span>
    </div>
    <h2>Contact & shipping</h2>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" value="aarav.mehta@example.in">
    <label for="name">Full name</label>
    <input id="name" name="fullname" value="Aarav Mehta">
    <label for="address">Address</label>
    <input id="address" name="address" value="42 Marine Drive, Nariman Point">
    <div class="row">
      <div><label for="city">City</label><input id="city" name="city" value="Mumbai"></div>
      <div><label for="zip">PIN code</label><input id="zip" name="pincode" value="400021"></div>
    </div>
    <h2>Payment</h2>
    <label for="card-number">Card number</label>
    <input id="card-number" name="card-number" autocomplete="cc-number" value="4111 1111 1111 1111">
    <div class="row">
      <div><label for="card-exp">Expiry</label><input id="card-exp" name="cc-exp" placeholder="MM/YY" value="09/27"></div>
      <div><label for="cvv">CVV</label><input id="cvv" name="cc-csc" autocomplete="cc-csc" value="123"></div>
    </div>
    <button id="payBtn" onclick="pay()">Pay now</button>
    <div class="ok" id="ok">✅ Payment successful — order #<span id="oid"></span></div>
  </div>
  <script>
    function pay() {
      document.getElementById('oid').textContent = Math.floor(100000 + Math.random() * 899999);
      document.getElementById('ok').style.display = 'block';
    }
    setInterval(() => {
      document.getElementById('addrOut').textContent =
        document.getElementById('address').value + ', ' + document.getElementById('city').value;
    }, 500);
  </script>
</body>
</html>
